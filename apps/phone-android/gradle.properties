org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Watch peer identity for Wear Engine P2P (see README "Identifiers").
# Override in local.properties (not committed) or with -P on the command line.
# WATCH_PEER_FINGERPRINT is a placeholder: real-device P2P will not connect until it is filled in
# with the signing fingerprint of the watch app.
watchPeerPkg=io.github.theogallandeng.hawatch
watchPeerFingerprint=PUT_WATCH_APP_FINGERPRINT_HERE
# AppGallery Connect app ID of the companion ("App ID" in AppGallery Connect, or "app_id" in
# agconnect-services.json). Placeholder: set the real one in local.properties.
hmsAppId=PUT_APPGALLERY_APP_ID_HERE
